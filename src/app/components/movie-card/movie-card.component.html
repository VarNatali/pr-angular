<div class="group-movie__movies movie">
    <div class="movie__card">
        <img [src]="item.backdrop_path" class="movie__image">
        <div class="movie__details">
            <h2>{{ item.title }}</h2>
            <p>Дата виходу: {{item.release_date}}</p>
            <p>Рейтинг: {{ item.rating }}</p>
            <p>Опис:{{ item.overview }}</p>
            <a class="movie__ref" href="#">Детальніше</a> <br>
            <div class="movie__more">
                <p>Тривалість:{{item.duration|dateFormat}}</p>
                <p> Режисер: {{ item.filmmaker }}</p>
                <p>Вікові обмеження:{{item.age_limits}}</p>
            </div>
            <div class="movie__buttons button-group">
                <button (click)="addToFavouriteList()" title="Додати в улюблене" class="button-group__favorite"></button>
                <button (click)="addToWatchList()" title="Переглянути пізніше" class="button-group__watch"></button>
                <ng-container>
                    <button *ngIf="isShowRemove" (click)="removeFromFavourite()" (click)="removeFromWatch()" title="Видалити" class="button-group__remove"></button>
                </ng-container>
            </div>
        </div>
    </div>
</div>
